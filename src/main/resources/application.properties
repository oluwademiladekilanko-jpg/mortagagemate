spring.application.name=mortgagemate

# In-memory H2 database - zero setup, resets each restart. Good enough for
# a portfolio project; swap for Postgres/MySQL later if you want data to persist.
spring.datasource.url=jdbc:h2:mem:mortgagemate
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Optional: browse the DB at http://localhost:8080/h2-console (JDBC URL above)
spring.h2.console.enabled=true

server.port=8080
